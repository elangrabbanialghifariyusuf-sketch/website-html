<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Profil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <nav class="navbar">
        <a class="profile" href="index.html">
            <img src="Screenshot 2025-12-19 141627.png" alt="Foto profil">
            <span>Profil</span>
        </a>

        <ul class="menu">
            <li><a href="index.html">Beranda</a></li>
            <li><a class="active" href="login.html">Login</a></li>
        </ul>
    </nav>

    <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
            <p class="login-eyebrow">Selamat datang kembali</p>
            <h1 id="login-title">Masuk ke akun</h1>
            <p class="login-description">Gunakan email dan kata sandi untuk melanjutkan.</p>

            <form id="login-form">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>

                <label for="password">Kata sandi</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" minlength="6" required>
                    <button class="password-toggle" type="button" aria-label="Tampilkan kata sandi" aria-pressed="false">
                        <svg class="eye-icon eye-open" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="2.5"></circle>
                        </svg>
                        <svg class="eye-icon eye-closed" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <path d="m3 3 18 18"></path>
                            <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3 3.8"></path>
                            <path d="M6.7 6.7C3.7 8.6 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.1-.8"></path>
                            <path d="M10 10a2.5 2.5 0 0 0 3.5 3.5"></path>
                        </svg>
                    </button>
                </div>

                <div class="form-options">
                    <label class="remember-option" for="remember">
                        <input id="remember" name="remember" type="checkbox">
                        <span>Ingat saya</span>
                    </label>
                    <a href="#lupa-kata-sandi">Lupa kata sandi?</a>
                </div>

                <button type="submit">Login</button>
                <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script>
        const loginForm = document.querySelector('#login-form');
        const loginMessage = document.querySelector('#login-message');
        const passwordInput = document.querySelector('#password');
        const passwordToggle = document.querySelector('.password-toggle');

        passwordToggle.addEventListener('click', () => {
            const isPasswordVisible = passwordInput.type === 'text';
            passwordInput.type = isPasswordVisible ? 'password' : 'text';
            passwordToggle.setAttribute('aria-label', isPasswordVisible ? 'Tampilkan kata sandi' : 'Sembunyikan kata sandi');
            passwordToggle.setAttribute('aria-pressed', String(!isPasswordVisible));
            passwordToggle.classList.toggle('is-visible', !isPasswordVisible);
        });

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            loginMessage.textContent = 'Form login siap dihubungkan ke sistem autentikasi.';
        });
    </script>
</body>
</html>
